name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # The Go, Python and C# helpers and their scenario tests need the three toolchains (the C# helper uses the
      # Roslyn assemblies of the .NET SDK, no NuGet package).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build
      - name: dist/ must match the sources
        run: |
          if ! git diff --exit-code --stat -- dist/; then
            echo "::error::dist/ is out of date: run npm run build and commit dist/"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
