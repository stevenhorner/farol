<title>farol · erich-oliveira-winnin/full-stack-fastapi-template #1</title>
<style>/* farol report: a review workbench. Sober neutrals, one accent, red only for what needs attention. */
:root {
  --bg: #ffffff; --rail: #f7f7f6; --surface: #ffffff; --text: #1c1c1e; --text-2: #55555c; --muted: #8e8e95; --line: #e8e6e3; --line-2: #d4d2ce;
  --ink: #2b2b2f; --sel: #ecebe8; --accent: #3056c9; --bad: #b42318; --good: #2e7d4f; --track: #eceae7;
  --add: #f1f8f2; --del: #fcf1f0;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121214; --rail: #18181b; --surface: #121214; --text: #ececee; --text-2: #b2b2b9; --muted: #7d7d86; --line: #2a2a2f; --line-2: #3b3b41;
  --ink: #e6e6e9; --sel: #26262b; --accent: #91a9ff; --bad: #f4796b; --good: #6cc495; --track: #27272c; --add: #15231a; --del: #2a1616; } }
:root[data-theme="dark"] {
  --bg: #121214; --rail: #18181b; --surface: #121214; --text: #ececee; --text-2: #b2b2b9; --muted: #7d7d86; --line: #2a2a2f; --line-2: #3b3b41;
  --ink: #e6e6e9; --sel: #26262b; --accent: #91a9ff; --bad: #f4796b; --good: #6cc495; --track: #27272c; --add: #15231a; --del: #2a1616; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
code { font-family: var(--mono); font-size: .9em; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
button { font: inherit; color: inherit; }
input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--ink); margin: 0; cursor: pointer; }

.top { height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--line); font-size: .85rem; color: var(--muted); position: sticky; top: 0; background: var(--bg); z-index: 5; }
.top .brand { display: inline-flex; align-items: center; line-height: 0; }
.top .brand svg { height: 28px; width: auto; }
.top .logo-dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .top .logo-light { display: none; } :root:not([data-theme="light"]) .top .logo-dark { display: inline-flex; } }
:root[data-theme="dark"] .top .logo-light { display: none; } :root[data-theme="dark"] .top .logo-dark { display: inline-flex; }
.top .repo { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.top .grow { flex: 1; }
.kbd { font-family: var(--mono); font-size: .72rem; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--text-2); }
.top .act { background: none; border: 1px solid var(--line-2); border-radius: 7px; padding: 3px 10px; cursor: pointer; color: var(--text); font-size: .8rem; white-space: nowrap; }
.top .act.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.top .act:hover { text-decoration: none; }
@media (max-width: 860px) { .top .keys-hint, .top .repo { display: none; } }

.layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: calc(100vh - 48px); }
.rail { background: var(--rail); border-right: 1px solid var(--line); position: sticky; top: 48px; height: calc(100vh - 48px); overflow: auto; padding: 18px 14px 24px; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); } }
.metric { padding: 4px 6px 14px; }
.metric + .metric { border-top: 1px solid var(--line); padding-top: 14px; }
.metric .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
.metric .value { font-size: 2rem; font-weight: 650; letter-spacing: -.03em; line-height: 1.1; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
.metric .value small { font-size: .85rem; font-weight: 500; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.metric .value.bad { color: var(--bad); }
.metric .sub { font-size: .8rem; color: var(--text-2); margin-top: 6px; }
.metric.ready { background: color-mix(in srgb, var(--good) 10%, transparent); border-radius: 10px; padding: 10px 10px 14px; margin-bottom: 6px; }
.metric.ready .value, .metric.ready .label span:last-child, .metric .ok { color: var(--good); }
.metric .ok { font-weight: 600; }
.metric.ready .track span { background: var(--good); }
.track { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; display: flex; }
.track span { height: 100%; background: var(--ink); }
.track span.bad { background: var(--bad); }
.track span.hatch { background: repeating-linear-gradient(135deg, var(--bad) 0 2px, transparent 2px 4px); opacity: .6; }

.nav { margin-top: 10px; }
.nav h4 { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 16px 6px 6px; font-weight: 600; display: flex; justify-content: space-between; }
.nav h4.mustcheck { color: var(--bad); }
.nav > a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px 6px 32px; border-radius: 7px; color: var(--text); font-size: .86rem; }
.nav > a:hover { background: var(--sel); text-decoration: none; }
.nav > a.on { background: var(--sel); font-weight: 600; }
.nav > a .r { font-size: .78rem; color: var(--muted); font-weight: 400; }
.fi { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 7px; font-size: .86rem; }
.fi:hover, .fi.on { background: var(--sel); }
.fi.on .n { font-weight: 600; }
.fi a.nm { display: flex; flex-direction: column; min-width: 0; color: var(--text); }
.fi a.nm:hover { text-decoration: none; }
.fi .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: .8rem; }
.fi .dirl { font-size: .7rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.fi .r { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.fi.done .n { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-2); }
.fi.must .n { font-family: inherit; font-size: .84rem; }
.fi.must .dirl { direction: ltr; }
.fi.must .r { color: var(--bad); }
.fi.must.done .r { color: var(--muted); }
details.tier > summary { list-style: none; cursor: pointer; font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 16px 6px 6px; font-weight: 600; display: flex; justify-content: space-between; }
details.tier > summary::-webkit-details-marker { display: none; }
details.tier > summary span:first-child::before { content: "▸ "; } details.tier[open] > summary span:first-child::before { content: "▾ "; }

.main { padding: 26px 34px 80px; max-width: 1100px; }
@media (max-width: 860px) { .main { padding: 20px 16px 60px; } }
h1 { font-size: 1.6rem; letter-spacing: -.02em; margin: 0 0 6px; font-weight: 650; }
h2 { font-size: 1rem; margin: 34px 0 10px; font-weight: 650; }
.lead { color: var(--text-2); max-width: 72ch; margin: 0 0 6px; }
.incremental { display: inline-block; font-size: .8rem; color: var(--text-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 10px; margin: 0 0 12px; }
.ready-banner { border: 1px solid color-mix(in srgb, var(--good) 40%, var(--line)); background: color-mix(in srgb, var(--good) 8%, transparent); border-radius: 10px; padding: 12px 14px; margin: 14px 0 0; }
.ready-banner b { color: var(--good); }
.stack { display: flex; height: 28px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 8px 0 10px; }
.stack div { height: 100%; display: flex; align-items: center; padding: 0 8px; font-size: .75rem; color: var(--bg); font-weight: 600; white-space: nowrap; overflow: hidden; min-width: 6px; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 18px; font-size: .82rem; }
.keys div { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.keys i { width: 10px; height: 10px; border-radius: 2px; }
.keys span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.keys a { color: var(--text); }
.keys b { font-variant-numeric: tabular-nums; }
details.cov > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 34px 0 10px; }
details.cov > summary::-webkit-details-marker { display: none; }
details.cov > summary h2 { margin: 0; }
details.cov > summary h2::before { content: "▸ "; color: var(--muted); font-weight: 400; } details.cov[open] > summary h2::before { content: "▾ "; }
details.cov > summary .sumtxt { color: var(--text-2); font-size: .88rem; }
details.cov > summary .clickhint { color: var(--accent); font-size: .82rem; }
details.cov > summary:hover .clickhint { text-decoration: underline; }
.misshead { font-size: .9rem; margin: 22px 0 4px; font-weight: 650; }
table.t { width: 100%; border-collapse: collapse; font-size: .85rem; }
table.t th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
table.t td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t .num { text-align: right; font-variant-numeric: tabular-nums; }
table.t .p { font-family: var(--mono); font-size: .8rem; overflow-wrap: anywhere; }
.mini { width: 120px; }

.fhead { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.fhead .grow { flex: 1; min-width: 260px; }
.fpath { font-family: var(--mono); font-size: 1.05rem; font-weight: 600; overflow-wrap: anywhere; }
.fpath .d { color: var(--muted); font-weight: 400; }
.facts { display: flex; gap: 22px; margin: 16px 0 18px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.facts div { font-size: .8rem; color: var(--muted); }
.facts b { display: block; font-size: 1.15rem; color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
.facts b.bad { color: var(--bad); }
.facts .of { color: var(--muted); font-size: .8rem; font-weight: 500; }
.primary { background: var(--ink); color: var(--bg); border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.primary.done { background: none; color: var(--text-2); border: 1px solid var(--line-2); }
.secondary { background: none; border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 12px; cursor: pointer; color: var(--text); font-size: .9rem; }
a.secondary:hover { text-decoration: none; background: var(--sel); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 26px; }
@media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
.aside h3 { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.aside ul { list-style: none; margin: 0 0 20px; padding: 0; }
.aside li { padding: 4px 0; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: .76rem; overflow-wrap: anywhere; }
.aside li.pp { font-family: inherit; font-size: .82rem; }
.note-in { width: 100%; min-height: 64px; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: .85rem; background: var(--surface); color: var(--text); resize: vertical; margin-bottom: 18px; }

.ghhint { font-size: .75rem; color: var(--muted); margin: 0 0 6px; }
.covhead { font-size: .84rem; color: var(--text-2); padding: 9px 12px; border: 1px solid var(--line); border-bottom: 0; border-radius: 8px 8px 0 0; }
.covhead.bad { box-shadow: inset 3px 0 0 var(--bad); }
.covhead b { color: var(--text); font-weight: 600; }
.covhead + .diff { border-radius: 0 0 8px 8px; }
.diff { border: 1px solid var(--line); border-radius: 8px; overflow: auto; background: var(--surface); }
.diff table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; }
.diff td { padding: 0 8px; white-space: pre; vertical-align: top; }
.diff .d-n { width: 1%; color: var(--muted); text-align: right; user-select: none; font-size: 11.5px; }
.diff a.d-gh { color: inherit; } .diff a.d-gh:hover { color: var(--accent); text-decoration: underline; }
.diff .d-hunk td { color: var(--muted); background: var(--track); padding: 3px 8px; font-size: 11.5px; }
.diff .d-add td { background: var(--add); } .diff .d-del td { background: var(--del); }
.diff .d-unc td.d-n { color: var(--bad); font-weight: 600; box-shadow: inset 3px 0 0 var(--bad); }
.diff .d-unclabel td { color: var(--bad); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px; font-weight: 600; padding: 6px 8px 2px; white-space: normal; }
.diff .d-note td { padding: 6px 8px 8px; white-space: normal; }
.diff tr.flash td { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--bad) 30%, transparent); } }
.note { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12.5px; border: 1px solid var(--line); border-left: 3px solid var(--line-2); border-radius: 6px; padding: 6px 10px; color: var(--text-2); max-width: 680px; }
.note.bad { border-left-color: var(--bad); } .note b { color: var(--text); font-weight: 600; margin-right: 6px; }

.mustbox { border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: 8px; padding: 12px 14px; margin: 14px 0; }
.mustbox.done { border-left-color: var(--line-2); }
.mustbox h3 { margin: 0 0 4px; font-size: .9rem; }
.mustbox p { margin: 0 0 8px; color: var(--text-2); font-size: .85rem; }
.mustbox code.snip { display: block; white-space: pre-wrap; background: var(--track); border-radius: 6px; padding: 6px 8px; margin: 6px 0 8px; font-size: .78rem; }
.ack { display: inline-flex; gap: 8px; align-items: center; font-size: .85rem; cursor: pointer; }
.ack.big { margin: 10px 0 0; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 8px; }
.dep { border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin: 0 0 14px; }
.dep .nm { font-family: var(--mono); font-weight: 650; font-size: 1rem; }
.dep .sec { font-size: .75rem; color: var(--muted); margin-left: 8px; }
.dep .ver { font-family: var(--mono); font-size: 1.3rem; margin: 10px 0 4px; }
.dep .ver .arrow { color: var(--muted); margin: 0 10px; }
.dep .bump { display: inline-block; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 650; border: 1px solid var(--line-2); border-radius: 999px; padding: 1px 8px; margin-left: 10px; vertical-align: 3px; color: var(--text-2); font-family: ui-sans-serif, system-ui, sans-serif; }
.dep .bump.bad { border-color: var(--bad); color: var(--bad); }
.dep .mean { color: var(--text-2); margin: 6px 0 12px; max-width: 70ch; }
.dep h4 { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
.dep ol { margin: 0; padding-left: 18px; font-size: .86rem; color: var(--text-2); }

.contract { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.contract .k { font-family: var(--mono); font-weight: 600; }
.contract ul { margin: 8px 0 0; padding: 0; list-style: none; font-size: .85rem; }
.contract li { display: grid; grid-template-columns: minmax(120px, 220px) 1fr; gap: 10px; padding: 3px 0; }
.contract li .w { font-family: var(--mono); font-size: .8rem; overflow-wrap: anywhere; }
.contract li.breaking .d { color: var(--bad); font-weight: 600; }
.contract li.safe { color: var(--muted); }
.pill { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 650; color: var(--bad); margin-left: 8px; }

.opsbox { margin-top: 18px; }
.ops-status { display: flex; gap: 18px; flex-wrap: wrap; font-size: .84rem; color: var(--text-2); margin: 0 0 10px; }
.ops-head { display: flex; justify-content: space-between; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 0 0 6px; }
.ops { border-top: 1px solid var(--line); }
.op { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.op-main { display: flex; gap: 10px; align-items: flex-start; flex: 1; min-width: 0; cursor: pointer; }
.op-main input { margin-top: 3px; }
.op-txt { min-width: 0; }
.op-path { font-family: var(--mono); font-size: .84rem; overflow-wrap: anywhere; }
.op-new { font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 650; margin-left: 8px; }
.op-traffic { font-size: .75rem; color: var(--text-2); margin-left: 8px; }
.op-via { display: block; font-size: .78rem; color: var(--muted); }
.op-via .gone { text-decoration: line-through; }
.op.done .op-path { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-2); }
.op-flag { flex: none; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: .76rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
.op-flag[aria-pressed="true"] { border-color: var(--ink); color: var(--text); font-weight: 600; }
.ops-more > summary { list-style: none; cursor: pointer; font-size: .82rem; color: var(--accent); padding: 10px 0; width: fit-content; }
.ops-more > summary::-webkit-details-marker { display: none; }
.ops-more .ops { border-top: 0; }

.details-frame { width: 100%; height: calc(100vh - 190px); min-height: 480px; border: 1px solid var(--line); border-radius: 10px; margin-top: 14px; background: var(--bg); }
.results pre { white-space: pre-wrap; background: var(--rail); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; font-size: .8rem; line-height: 1.55; max-height: 60vh; overflow: auto; }
.results .btns { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; align-items: center; }
.saved { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 6px 0 18px; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; }
.saved .big { font-size: 2rem; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.saved p { margin: 0; color: var(--text-2); font-size: .86rem; }
.saved .bar, .saved small { grid-column: 1 / -1; }
.saved small { color: var(--muted); font-size: .75rem; }
footer { color: var(--muted); font-size: .75rem; margin-top: 40px; }
</style>
</head>

.ownership { margin-top: 14px; }\nol.owners { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }\nli.owner { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--panel); box-shadow: var(--shadow); }\n.owner-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }\n.owner-head .muted { margin-left: auto; }\n.bar.owner-bar { height: 6px; margin: 8px 0; }\n.bar.owner-bar > span { background: var(--accent); }\n.owner-files { display: flex; flex-wrap: wrap; gap: 4px; }\n.pill.owner { background: color-mix(in srgb, var(--isolated) 10%, var(--panel)); color: var(--text); }\n/* Feature flags. */\nbutton.flag-toggle { font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px dashed var(--line); background: transparent; color: var(--muted); cursor: pointer; opacity: .75; transition: opacity .15s, background .15s, color .15s, border-color .15s; }\ndetails.route:hover button.flag-toggle, button.flag-toggle:focus-visible { opacity: 1; }\nbutton.flag-toggle[aria-pressed=\"true\"] { opacity: 1; border-style: solid; border-color: color-mix(in srgb, var(--global) 45%, transparent); background: color-mix(in srgb, var(--global) 12%, var(--panel)); color: var(--global); font-weight: 600; }\ndetails.route.is-flagged { border-style: dashed; border-color: color-mix(in srgb, var(--global) 45%, var(--line)); }\ndetails.route.is-flagged .route-path { opacity: .7; }\n.flag-note:not(:empty) { margin-left: 8px; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; color: var(--global); background: color-mix(in srgb, var(--global) 12%, var(--panel)); }\n.file-row.is-flagged { opacity: .55; }\n.file-row.is-flagged .file-main { text-decoration: none; }\n.review-file.is-flagged { text-decoration: none; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\u003cmain>\n\u003cnav class=\"sectionbar\">\u003ca href=\"#risk\">Risk\u003cspan class=\"count bad\">1\u003c/span>\u003c/a>\u003ca href=\"#security\">Security\u003c/a>\u003ca href=\"#dependencies\">Dependencies\u003cspan class=\"count bad\">1\u003c/span>\u003c/a>\u003ca href=\"#signals\">Coverage\u003c/a>\u003ca href=\"#reviewers\">Reviewers\u003c/a>\u003ca href=\"#routes\">Routes\u003cspan class=\"count\">4\u003c/span>\u003c/a>\u003ca href=\"#files\">Files\u003cspan class=\"count\">21\u003c/span>\u003c/a>\u003ca href=\"#details\">Details\u003c/a>\u003c/nav>\n\u003cdiv class=\"section\" id=\"risk\">\u003ch2 class=\"section-title\">Risk\u003c/h2>\u003csection class=\"panel\">\u003cp class=\"small muted\">Every changed code file, riskiest first. Risk points (0–100, as in the merge risk score) combine its reach with what its diff coverage leaves and its findings. Reach: centrality of each changed file in the import graph: who uses it directly, how many files depend on it through any chain of imports, and how many of the 8 existing pages reach it. High: used by at least half of the pages (or 10+ pages). Medium: used by some page, or by 10+ files, or new code inside existing pages, or deleted. Low: additive, or not used by existing pages.\u003c/p>\u003cdiv class=\"stats\">\u003cdiv class=\"stat bad\">\u003cdiv class=\"value\">1\u003c/div>\u003cdiv class=\"label\">high reach\u003c/div>\u003c/div>\u003cdiv class=\"stat warn\">\u003cdiv class=\"value\">4\u003c/div>\u003cdiv class=\"label\">medium reach\u003c/div>\u003c/div>\u003cdiv class=\"stat \">\u003cdiv class=\"value\">6\u003c/div>\u003cdiv class=\"label\">low reach\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"filters\" id=\"risk-filters\">\u003cspan class=\"filter-label\">Risk:\u003c/span>\u003clabel class=\"filter\">\u003cinput type=\"checkbox\" data-filter=\"level\" value=\"high\" checked> high \u003cspan class=\"muted\">(1)\u003c/span>\u003c/label>\u003clabel class=\"filter\">\u003cinput type=\"checkbox\" data-filter=\"level\" value=\"medium\" checked> medium \u003cspan class=\"muted\">(4)\u003c/span>\u003c/label>\u003clabel class=\"filter\">\u003cinput type=\"checkbox\" data-filter=\"level\" value=\"low\" checked> low \u003cspan class=\"muted\">(6)\u003c/span>\u003c/label>\n\u003cspan class=\"filter-label\">Change:\u003c/span>\u003clabel class=\"filter\">\u003cinput type=\"checkbox\" data-filter=\"change\" value=\"modified\" checked> modified \u003cspan class=\"muted\">(6)\u003c/span>\u003c/label>\u003clabel class=\"filter\">\u003cinput type=\"checkbox\" data-filter=\"change\" value=\"added\" checked> added \u003cspan class=\"muted\">(3)\u003c/span>\u003c/label>\u003clabel class=\"filter\">\u003cinput type=\"checkbox\" data-filter=\"change\" value=\"additive\" checked> additive \u003cspan class=\"muted\">(2)\u003c/span>\u003c/label>\u003cspan class=\"muted small\" id=\"risk-count\">\u003c/span>\u003c/div>\u003cdiv id=\"risk-table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>File\u003c/th>\u003cth>Change\u003c/th>\u003cth class=\"num\">Reach (existing pages)\u003c/th>\u003cth>Diff coverage\u003c/th>\u003cth>Findings\u003c/th>\u003cth class=\"num\">Risk points\u003c/th>\u003cth>Why\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr data-level=\"high\" data-change=\"modified\">\u003ctd>\u003ca class=\"path\" title=\"frontend/src/components/Sidebar/AppSidebar.tsx\" href=\"https://github.com/erich-oliveira-winnin/full-stack-fastapi-template/pull/1/files#diff-0b4962fd6e2a808d8a7dd8c897c3984f36346813031385cefd01c791cd8a57be\" target=\"_blank\" rel=\"noopener\">components/Sidebar/AppSidebar.tsx\u003c/a>\u003c/td>\u003ctd>\u003cspan class=\"tag \">modified\u003c/span>\u003c/td>\u003ctd class=\"num\" title=\"1 direct importer(s) · 3 transitive dependent(s) · centrality 0.029\">\u003cspan class=\"chip high\">high\u003c/span> 4 / 8\u003cdiv class=\"mini-bar\">\u003cspan style=\"width:50.0%\">\u003c/span>\u003c/div>\u003c/td>\u003ctd>\u003cspan class=\"pill bad\">0%\u003c/span>\u003c/td>\u003ctd>\u003c/td>\u003ctd class=\"num\">\u003cspan class=\" const listText = (xs) => (xs.length <= 1 ? xs.join('') : t(T.listAnd, { items: xs.slice(0, -1).join(', '), last: xs[xs.length - 1] }))
const TERM = D.term

/* Review state, kept in this browser per commit. */
const KEY = `farol-review:${D.repo ?? ''}:${D.head}:${D.surface}`
const EMPTY = () => ({ reviewed: [], acked: [], tested: [], flagged: [], notes: {} })
const state = (() => { try { return { ...EMPTY(), ...JSON.parse(localStorage.getItem(KEY)) } } catch { return EMPTY() } })()
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)) } catch { /* private window: state lives until the page closes */ } }
const listeners = []
const onChange = (fn) => listeners.push(fn)
const emit = () => { save(); listeners.forEach((fn) => fn()) }
const setIn = (list, id, on) => { const set = new Set(state[list]); if (on) set.add(id); else set.delete(id); state[list] = [...set] }
const toggle = (list, id, on) => { setIn(list, id, on ?? !state[list].includes(id)); emit() }
const isReviewed = (file) => state.reviewed.includes(file)
const isAcked = (id) => state.acked.includes(id)

/* Feature flags: a changed file whose pages/operations all ship behind a flag leaves the score, like a reviewed one. */
const OPS = D.ops
const FILE_OPS = new Map()
for (const op of OPS) for (const f of op.files) FILE_OPS.set(f, [...(FILE_OPS.get(f) ?? []), op.key])
const isFlagged = (key) => state.flagged.includes(key)
const flagCovered = (file) => { const keys = FILE_OPS.get(file); return !!keys?.length && keys.every(isFlagged) }

/* Score groups: one per file, one per finding (security, lint: checked on their own, not by reviewing the file), and
 * one per item without a file (contract, vulnerable dependency, analysis problems). The PR comment splits the score
 * the same way (src/report/review-parts.ts). */
const FINDING_KINDS = new Set(['security', 'lint'])
const lineOf = (title) => Number(title.match(/at line (\d+)/)?.[1] ?? 0)
const logOf = (items) => items.reduce((s, it) => s - Math.log(1 - it.weight), 0)
/* Something farol could not read (a route path computed at run time…): checked by hand, not by reviewing the file. */
const UNREAD = 'unknown'
const GROUPS = D.groups.flatMap((g, i) => {
  const rest = g.items.filter((it) => !(g.file && (FINDING_KINDS.has(it.kind) || it.kind === UNREAD)))
  const findings = g.file ? g.items.filter((it) => FINDING_KINDS.has(it.kind)) : []
  const unread = g.file ? g.items.filter((it) => it.kind === UNREAD) : []
  return [
    ...(rest.length ? [{ file: g.file, items: rest, id: g.file ?? `item:${g.items[0].kind}:${i}`, log: logOf(rest) }] : []),
    ...findings.map((it) => ({ file: null, owner: g.file, items: [it], id: `finding:${it.kind}:${g.file}:${lineOf(it.title)}`, log: logOf([it]) })),
    ...unread.map((it, j) => ({ file: null, items: [it], id: `unread:${g.file}:${j}`, log: logOf([it]) })),
  ]
})
const groupActive = (g) => (g.file ? !isReviewed(g.file) && !flagCovered(g.file) : !isAcked(g.id))
/** What must be checked by hand, above every file: breaking contracts, security findings, lint errors, vulnerable dependencies. */
const isMust = (g) => g.owner != null || g.items.every((i) => i.kind === 'contract' || i.kind === 'vulnerability' || i.kind === UNREAD)
const MUST = GROUPS.filter(isMust)
/** Removable by the reviewer: files by reviewing them, the rest of Must check by checking it. */
const groupRemovable = (g) => g.file !== null || isMust(g)
const findingLine = (g) => lineOf(g.items[0].title)
const SCORE0 = Math.round(100 * (1 - Math.exp(-GROUPS.reduce((n, g) => n + g.log, 0))))

function liveScore() {
  const L = GROUPS.filter(groupActive).reduce((s, g) => s + g.log, 0)
  return Math.round(100 * (1 - Math.exp(-L)))
}
/** Integer shares of the score that add up to it (log attribution, largest remainder). */
function shares(groups) {
  const L = groups.reduce((s, g) => s + g.log, 0)
  const score = 100 * (1 - Math.exp(-L))
  const rows = groups.map((g) => { const v = L === 0 ? 0 : (score * g.log) / L; return { group: g, v, points: Math.floor(v) } })
  let left = Math.round(score) - rows.reduce((s, r) => s + r.points, 0)
  ;[...rows].sort((a, b) => (b.v - b.points) - (a.v - a.points)).forEach((r) => { if (left > 0) { r.points++; left-- } })
  return rows.sort((a, b) => b.v - a.v)
}
/** Share of the current score owed to each part still active. */
const attribution = () => shares(GROUPS.filter(groupActive))
/** Shares with nothing reviewed: the points each part had at first. */
const attributionAll = () => shares(GROUPS)
const POINTS0 = new Map(attributionAll().map((a) => [a.group.id, a.points]))
/** Each file's share of the current score: what ticking it removes now. */
const shareOf = () => new Map(attribution().filter((a) => a.group.file).map((a) => [a.group.file, a.points]))
function topParts(att, max) {
  const list = att.filter((a) => a.points > 0)
  return list.length <= max + 1 ? { top: list, rest: [] } : { top: list.slice(0, max), rest: list.slice(max) }
}
const levelOf = (s) => (s >= 60 ? 'high' : s >= 30 ? 'medium' : 'low')
/** A low score and nothing left in Must check: what is left looks safe to approve. */
function readiness() {
  const s = liveScore()
  const mustLeft = MUST.filter(groupActive).length
  return { s, mustLeft, ready: levelOf(s) === 'low' && mustLeft === 0 }
}

/* Files to review: their own points leave the findings out, so tiers rank the code change itself. */
const FILES = D.files.map((f) => { const g = GROUPS.find((x) => x.file === f.path); return { ...f, points: g ? Math.round(100 * (1 - Math.exp(-g.log))) : 0 } })
  .sort((a, b) => b.points - a.points || (a.path < b.path ? -1 : 1))
const TIERS = [{ id: 'high', min: 20 }, { id: 'medium', min: 5 }, { id: 'skim', min: -1, collapsed: true }, { id: 'tests', min: Infinity, collapsed: true }]
const tierOf = (f) => (f.extra === 'tests' ? 'tests' : TIERS.find((x) => f.points >= x.min).id)
const filesByTier = () => TIERS.map((x) => ({ ...x, label: T.tiers[x.id], files: FILES.filter((f) => tierOf(f) === x.id) })).filter((x) => x.files.length)
const fileDone = (f) => isReviewed(f.path) || flagCovered(f.path)

function groupLabel(g) {
  if (g.file) return short(g.file)
  const it = g.items[0]
  if (g.owner) return t(it.kind === 'security' ? T.must.securityAt : T.must.lintAt, { file: base(g.owner), line: findingLine(g) })
  return T.kinds[it.kind] ?? it.kind
}
function groupWhy(g) {
  const f = g.file && FILES.find((x) => x.path === g.file)
  if (f && f.why) return f.why
  return g.items.map((i) => i.title).join(' · ')
}

/** One sentence on where the risk comes from (the two largest parts at first) and how far the change reaches. */
function riskLede() {
  const top = attributionAll().filter((a) => a.points > 0).slice(0, 2).map(({ group: g }) => {
    const it = g.items[0]
    if (it.kind === 'contract') return t(T.lede.contract, { key: `<code>${esc(it.title.match(/of (.+?):/)?.[1] ?? '')}</code>` })
    if (g.owner) return t(it.kind === 'security' ? T.lede.security : T.lede.lint, { file: `<code>${esc(base(g.owner))}</code>` })
    if (it.kind === UNREAD) return t(T.lede.unknown, { what: esc(it.title.slice(it.title.indexOf(': ') + 2)) })
    if (!g.file) return esc(it.title)
    const code = `<code>${esc(base(g.file))}</code>`
    if (g.items.some((i) => i.kind === 'global')) return t(T.lede.global, { file: code })
    const deps = D.dependencies.filter((c) => c.manifest === g.file && g.items.some((i) => i.kind === 'dependency' && i.title.startsWith(c.name + ' ')))
    if (deps.length) {
      const c = [...deps].sort((a, b) => Number(b.critical) - Number(a.critical))[0]
      return c.from && c.to ? t(c.critical ? T.lede.bumpMayBreak : T.lede.bump, { name: `<code>${esc(c.name)}</code>`, from: esc(c.from), to: esc(c.to) }) : t(T.lede.dependency, { name: `<code>${esc(c.name)}</code>`, change: esc(c.change) })
    }
    if (it.kind === 'tests') return t(T.lede.tests, { file: code })
    const f = FILES.find((x) => x.path === g.file)
    return f?.why ? t(T.lede.file, { file: code, why: esc(f.why) }) : code
  })
  const code = FILES.filter((f) => !f.extra).length
  const reach = t(T.lede.reach, { files: pl(code, T.codeFiles), n: D.routes.affected, total: D.totalEntries, many: TERM.many })
  const added = D.routes.added ? t(T.lede.added, { what: pl(D.routes.added, T.newEntries) }) : ''
  return `${top.length ? t(T.lede.top, { parts: listText(top) }) + ' ' : ''}${reach}${added}.`
}

/* Coverage of the changed lines. */
const COV = D.coverage.status === 'ok' ? D.coverage : null
const covOf = (path) => COV?.files.find((f) => f.path === path) ?? null
function coverageSummary() {
  if (!COV || !COV.total) return null
  const reported = COV.files.filter((f) => !f.missing)
  const rTotal = reported.reduce((s, f) => s + f.total, 0)
  const rCovered = reported.reduce((s, f) => s + f.covered, 0)
  const missing = COV.files.filter((f) => f.missing)
  return { ratio: COV.covered / COV.total, covered: COV.covered, total: COV.total, missing, missingLines: missing.reduce((s, f) => s + f.total, 0), reportedRatio: rTotal ? rCovered / rTotal : 1 }
}
const inRanges = (line, ranges) => ranges.some((r) => line >= r.start && line <= r.end)
const rangeText = (r) => (r.start === r.end ? `${r.start}` : `${r.start}–${r.end}`)

/* GitHub: a changed file in the pull request, and one line of it (where a comment can be left). */
const ghFile = (path) => D.links.files[path] ?? null
const ghLine = (path, side, n) => (D.links.files[path] ? `${D.links.files[path]}${side}${n}` : null)

/** Findings on a file's lines, to annotate its diff. */
function notesOf(path) {
  const notes = []
  for (const s of D.security) if (s.path === path) notes.push({ line: s.line, tone: 'bad', label: t(T.diff.security, { severity: s.severity }), text: s.message })
  for (const l of D.lint) if (l.path === path && !D.security.some((s) => s.path === path && s.line === l.line)) notes.push({ line: l.line, tone: '', label: t(T.diff.lint, { rule: l.rule }), text: l.message })
  for (const s of D.suppressions) if (s.path === path) notes.push({ line: s.line, tone: '', label: t(T.diff.suppression, { kind: s.kind }), text: s.text })
  return notes
}
function addedLines(path) {
  const out = new Map()
  for (const h of D.diffs[path] ?? []) {
    let n = h.newStart
    for (const line of h.lines) { if (line[0] === '+') out.set(n++, line.slice(1)); else if (line[0] !== '-') n++ }
  }
  return out
}
/** One sentence on a file's diff coverage, with links that jump to each stretch that never ran. */
function coverageNote(path) {
  const cf = covOf(path)
  if (!cf) return COV ? '' : `<div class="covhead">${T.diff.noReport}</div>`
  if (cf.missing) return `<div class="covhead bad">${t(T.diff.missing, { n: cf.total })}</div>`
  if (cf.total === 0) return `<div class="covhead">${T.diff.declarations}</div>`
  const added = addedLines(path)
  const blocks = cf.uncovered.filter((r) => [...added.keys()].some((k) => k >= r.start && k <= r.end))
  if (!blocks.length) return `<div class="covhead">${t(T.diff.allRan, { n: cf.total })}</div>`
  const links = blocks.map((b) => `<a href="#" data-jump="${b.start}">${rangeText(b)}</a>`)
  return `<div class="covhead bad">${t(T.diff.someRan, { covered: cf.covered, total: cf.total, missing: pl(cf.total - cf.covered, T.lines), ranges: listText(links) })}</div>`
}
const lnk = (path, side, n) => { const url = ghLine(path, side, n); return url ? `<a class="d-gh" href="${esc(url)}" target="_blank" rel="noopener" title="${esc(T.diff.commentLine)}">${n}</a>` : n }
/** Unified diff of a file; lines the tests never ran are marked and each stretch of them is labeled. */
function renderDiff(path, maxLines = 1500) {
  const hunks = D.diffs[path]
  if (!hunks) return `<p class="muted small">${T.diff.none}${ghFile(path) ? ` <a href="${esc(ghFile(path))}" target="_blank" rel="noopener">${T.diff.seeInPr}</a>` : ''}</p>`
  const cf = covOf(path)
  const marks = cf && !cf.missing && cf.total > 0
  const notes = notesOf(path)
  const added = addedLines(path)
  let rows = ''
  let count = 0
  let inBlock = false
  for (const h of hunks) {
    rows += `<tr class="d-hunk"><td colspan="3">${esc(h.header)}</td></tr>`
    let o = h.oldStart
    let n = h.newStart
    for (const line of h.lines) {
      if (count++ > maxLines) break
      const kind = line[0]
      const text = esc(line.slice(1)) || ' '
      if (kind === '+') {
        const unc = marks && inRanges(n, cf.uncovered)
        if (unc && !inBlock) {
          const r = cf.uncovered.find((x) => n >= x.start && n <= x.end)
          const shown = [...added.keys()].filter((k) => k >= r.start && k <= r.end)
          rows += `<tr class="d-unclabel" data-ln="${n}"><td colspan="2"></td><td>${t(T.diff.notRun, { lines: rangeText({ start: shown[0] ?? r.start, end: shown[shown.length - 1] ?? r.end }) })}</td></tr>`
        }
        inBlock = unc
        rows += `<tr class="d-add${unc ? ' d-unc' : ''}" data-new="${n}"><td class="d-n"></td><td class="d-n">${lnk(path, 'R', n)}</td><td class="d-c">${text}</td></tr>`
        for (const nt of notes.filter((x) => x.line === n)) rows += `<tr class="d-note"><td colspan="2"></td><td><div class="note ${nt.tone}"><b>${esc(nt.label)}</b> ${esc(nt.text)}</div></td></tr>`
        n++
      } else if (kind === '-') {
        rows += `<tr class="d-del"><td class="d-n">${lnk(path, 'L', o)}</td><td class="d-n"></td><td class="d-c">${text}</td></tr>`
        o++
      } else {
        inBlock = false
        rows += `<tr data-new="${n}"><td class="d-n">${o}</td><td class="d-n">${lnk(path, 'R', n)}</td><td class="d-c">${text}</td></tr>`
        o++
        n++
      }
    }
  }
  return `<div class="diffbox">${ghFile(path) ? `<div class="ghhint">${T.diff.hint}</div>` : ''}${coverageNote(path)}<div class="diff"><table>${rows}</table></div></div>`
}
/** Scrolls a diff to a line and flashes it. */
function flashRow(row) {
  if (!row) return
  row.scrollIntoView({ behavior: 'smooth', block: 'center' })
  row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash')
}
document.addEventListener('click', (e) => {
  const a = e.target.closest?.('[data-jump]')
  if (!a) return
  e.preventDefault()
  flashRow(document.querySelector(`tr[data-ln="${a.dataset.jump}"]`) ?? document.querySelector(`tr[data-new="${a.dataset.jump}"]`))
})

/* Theme: follows the system, with a manual override. */
function initTheme(button) {
  const root = document.documentElement
  try { const saved = localStorage.getItem('farol-theme'); if (saved) root.dataset.theme = saved } catch { /* no storage */ }
  button?.addEventListener('click', () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
    root.dataset.theme = dark ? 'light' : 'dark'
    try { localStorage.setItem('farol-theme', root.dataset.theme) } catch { /* no storage */ }
    window.dispatchEvent(new Event('farol-theme'))
  })
}
</script>
<script>
/* farol report, in the browser (2/3): the side rail, the summary and the views of one file, one finding and one
 * dependency manifest. Uses wb-core.js. */
const midCut = (s, n) => (s.length <= n ? s : `${s.slice(0, Math.ceil(n * 0.45))}…${s.slice(s.length - Math.floor(n * 0.55))}`)
const SHADES = ['var(--ink)', 'color-mix(in srgb, var(--ink) 72%, var(--bg))', 'color-mix(in srgb, var(--ink) 52%, var(--bg))', 'color-mix(in srgb, var(--ink) 36%, var(--bg))', 'color-mix(in srgb, var(--ink) 24%, var(--bg))']
const S = coverageSummary()
const ui = { view: 'summary', tierOpen: new Set(), covOpen: false }
const contractGroups = MUST.filter((g) => g.items[0].kind === 'contract')
const breakingKeys = () => (D.contracts ?? []).filter((e) => e.level !== 'safe').map((e) => e.key)
/** Must check as the rail lists it: all contract changes as one item, then each finding and vulnerable dependency. */
const mustList = () => [...(contractGroups.length ? [{ contract: true, groups: contractGroups }] : []), ...MUST.filter((g) => !contractGroups.includes(g)).map((g) => ({ contract: false, groups: [g] }))]
const mustDone = (m) => m.groups.every((g) => !groupActive(g))

function rail() {
  const R = readiness()
  const s = R.s
  const done = FILES.filter(fileDone).length
  const share = shareOf()
  const cov = S
    ? `<div class="metric"><div class="label"><span>${T.rail.tested}</span></div><div class="value${S.ratio < 0.5 ? ' bad' : ''}">${pct(S.ratio)}</div>
    <div class="track"><span style="width:${(S.covered / S.total) * 100}%"></span><span class="bad" style="width:${((S.total - S.covered - S.missingLines) / S.total) * 100}%"></span><span class="hatch" style="width:${(S.missingLines / S.total) * 100}%"></span></div>
    <div class="sub">${t(T.rail.testedSub, { covered: S.covered, total: S.total })}${S.missing.length ? t(T.rail.testedWithout, { ratio: pct(S.reportedRatio), files: pl(S.missing.length, T.files) }) : ''}</div></div>`
    : `<div class="metric"><div class="label"><span>${T.rail.tested}</span></div><div class="value">—</div><div class="sub">${D.coverage.status === 'ok' ? T.rail.noExecutable : T.rail.noReport}</div></div>`
  const item = (f) => {
    const flagged = flagCovered(f.path) && !isReviewed(f.path)
    const on = fileDone(f)
    return `<div class="fi${ui.view === 'file:' + f.path ? ' on' : ''}${on ? ' done' : ''}"><input type="checkbox" data-review-cb="${esc(f.path)}" ${on ? 'checked' : ''} ${flagged ? `disabled title="${esc(T.rail.flagged)}"` : ''} aria-label="${esc(T.rail.reviewedBox)}"><a href="#file:${esc(f.path)}" class="nm" title="${esc(short(f.path))}"><span class="n">${esc(midCut(base(f.path), 25))}</span><span class="dirl">${esc(dir(f.path).replace(/\/$/, '')) || '&nbsp;'}</span></a><span class="r">${on ? '' : share.get(f.path) ?? 0}</span></div>`
  }
  const tiers = filesByTier().map((x) => {
    const count = `${x.files.filter(fileDone).length}/${x.files.length}`
    return x.collapsed
      ? `<details class="tier" ${ui.tierOpen.has(x.id) ? 'open' : ''} data-tier="${x.id}"><summary><span>${x.label}</span><span>${count}</span></summary>${x.files.map(item).join('')}</details>`
      : `<h4><span>${x.label}</span><span>${count}</span></h4>${x.files.map(item).join('')}`
  }).join('')
  const mustItem = (m) => {
    const g = m.groups[0]
    const target = m.contract ? 'contract' : 'finding:' + g.id
    const title = m.contract ? T.must.contract : g.owner ? (g.items[0].kind === 'security' ? T.must.security : T.must.lint) : g.items[0].kind === UNREAD ? T.must.unknown : T.must.vulnerability
    const sub = m.contract ? breakingKeys().join(', ') : g.owner ? `${base(g.owner)}:${findingLine(g)}` : g.items[0].title
    const on = mustDone(m)
    const points = m.groups.reduce((n, x) => n + (POINTS0.get(x.id) ?? 0), 0)
    return `<div class="fi must${ui.view === target ? ' on' : ''}${on ? ' done' : ''}"><input type="checkbox" data-ack="${esc(m.groups.map((x) => x.id).join('|'))}" ${on ? 'checked' : ''} aria-label="${esc(T.rail.checkedBox)}"><a href="#${esc(target)}" class="nm"><span class="n">${esc(title)}</span><span class="dirl">${esc(sub)}</span></a><span class="r">${on ? '' : points}</span></div>`
  }
  const must = mustList()
  const sub = R.ready ? `<span class="ok">${T.rail.ready}</span>` : levelOf(s) === 'low' && R.mustLeft ? t(T.rail.lowButMust, { items: pl(R.mustLeft, T.items) }) : T.verdict[D.verdict]
  document.getElementById('rail').innerHTML = `
  <div class="metric${R.ready ? ' ready' : ''}"><div class="label"><span>${T.rail.risk}</span><span>${T.levels[levelOf(s)]}</span></div><div class="value">${s}<small>/100</small></div>
    <div class="track"><span class="${levelOf(s) === 'high' ? 'bad' : ''}" style="width:${Math.max(s, 1)}%"></span></div>
    <div class="sub">${sub}${s !== SCORE0 ? t(T.rail.was, { score: SCORE0 }) : ''}</div></div>
  ${cov}
  <div class="metric"><div class="label"><span>${T.rail.reviewed}</span><span>${done} / ${FILES.length}</span></div><div class="track"><span style="width:${(done / Math.max(1, FILES.length)) * 100}%"></span></div></div>
  <nav class="nav">
    <a href="#summary" class="${ui.view === 'summary' ? 'on' : ''}"><span class="n">${T.nav.summary}</span></a>
    ${must.length ? `<h4 class="mustcheck"><span>${T.nav.must}</span><span>${must.filter(mustDone).length}/${must.length}</span></h4>${must.map(mustItem).join('')}` : ''}
    ${tiers}
    <h4><span>${T.nav.before}</span></h4>
    ${D.contracts && !contractGroups.length ? `<a href="#contract" class="${ui.view === 'contract' ? 'on' : ''}"><span class="n">${T.nav.contract}</span><span class="r">${T.nav.contractSafe}</span></a>` : ''}
    <a href="#plan" class="${ui.view === 'plan' ? 'on' : ''}"><span class="n">${T.nav.plan}</span><span class="r">${pl(OPS.length, T.entriesPair)}</span></a>
    <a href="#details" class="${ui.view === 'details' ? 'on' : ''}"><span class="n">${T.nav.details}</span></a>
    <h4><span>${T.nav.finish}</span></h4>
    <a href="#results" class="${ui.view === 'results' ? 'on' : ''}"><span class="n">${T.nav.results}</span><span class="r">${T.nav.resultsHint}</span></a>
  </nav>`
}

function summary() {
  const att = attribution()
  const s = liveScore()
  const R = readiness()
  const rows = [...(COV?.files ?? [])].filter((f) => !f.missing).sort((a, b) => (b.total - b.covered) - (a.total - a.covered))
  const missing = (COV?.files ?? []).filter((f) => f.missing).sort((a, b) => b.total - a.total)
  const leftOut = COV?.leftOut ?? []
  const table = S ? `<table class="t"><thead><tr><th>${T.cov.file}</th><th class="num">${T.cov.tested}</th><th class="mini"></th><th>${T.cov.notRun}</th></tr></thead><tbody>${rows.map((f) => `<tr><td class="p">${esc(short(f.path))}</td><td class="num">${f.covered}/${f.total} · ${pct(f.total ? f.covered / f.total : 1)}</td>
    <td class="mini"><div class="track"><span style="width:${f.total ? (f.covered / f.total) * 100 : 100}%"></span><span class="bad" style="width:${f.total ? ((f.total - f.covered) / f.total) * 100 : 0}%"></span></div></td>
    <td class="small muted">${f.uncovered.map(rangeText).join(', ') || '—'}</td></tr>`).join('')}</tbody></table>
    ${missing.length ? `<h3 class="misshead">${t(T.cov.missingTitle, { files: pl(missing.length, T.files) })}</h3><p class="small muted">${T.cov.missingWhy}</p><table class="t"><tbody>${missing.map((f) => `<tr><td class="p">${esc(short(f.path))}</td><td class="num small muted">${pl(f.total, T.changedLines)}</td></tr>`).join('')}</tbody></table>` : ''}
    ${leftOut.length ? `<h3>${t(T.cov.leftOutTitle, { files: pl(leftOut.length, T.files) })}</h3><p class="small muted">${T.cov.leftOutWhy}</p><table class="t"><tbody>${leftOut.map((f) => `<tr><td class="p">${esc(short(f.path))}</td><td class="small muted">${T.cov.leftOutBy[f.by]}</td></tr>`).join('')}</tbody></table>` : ''}`
    : `<p class="muted">${D.coverage.status === 'ok' ? T.rail.noExecutable : T.cov.none}</p>`
  const parts = (() => {
    if (!att.length) return `<p class="muted">${T.summary.allReviewed}</p>`
    const { top, rest } = topParts(att, 11)
    const restPts = rest.reduce((n, a) => n + a.points, 0)
    const segs = [...top.map((a, i) => ({ pts: a.points, color: SHADES[Math.min(i, SHADES.length - 1)], label: groupLabel(a.group), why: groupWhy(a.group), file: a.group.file })), ...(rest.length ? [{ pts: restPts, color: 'color-mix(in srgb, var(--ink) 14%, var(--bg))', label: pl(rest.length, T.otherParts), why: rest.map((a) => groupLabel(a.group)).join(', '), file: null }] : [])]
    return `<div class="stack">${segs.map((x) => `<div style="flex:${x.pts};background:${x.color}" title="${esc(x.label)}: ${x.pts}">${x.pts >= 8 ? x.pts : ''}</div>`).join('')}</div>
    <div class="keys">${segs.map((x) => `<div><i style="background:${x.color}"></i><span title="${esc(x.why)}">${x.file ? `<a href="#file:${esc(x.file)}"><code>${esc(base(x.file))}</code></a>` : esc(x.label)}</span><b>${x.pts}</b></div>`).join('')}</div>`
  })()
  const covLine = S ? t(T.cov.summary, { ratio: pct(S.ratio), covered: S.covered, total: S.total }) + (S.missing.length ? t(T.cov.summaryWithout, { ratio: pct(S.reportedRatio), files: pl(S.missing.length, T.files) }) : '') : T.cov.none
  return `${D.incremental ? `<p class="incremental">${t(T.summary.incremental, { since: esc(D.incremental) })}</p>` : ''}
  <h1>${R.ready ? T.summary.ready : T.verdict[D.verdict]}</h1><p class="lead">${riskLede()}</p>
  ${R.ready ? '' : `<p class="small muted">${MUST.length ? T.summary.startMust : T.summary.start}</p>`}
  ${R.ready ? `<div class="ready-banner"><b>${t(T.summary.readyTitle, { score: s })}</b> ${s !== SCORE0 ? t(T.summary.readyDown, { score: SCORE0 }) : T.summary.readyNothing} <a href="#results">${T.summary.copyResults}</a></div>` : ''}
  ${D.usage ? `<p class="small muted">${esc(D.usage)}</p>` : ''}
  <h2>${t(T.summary.makesUp, { score: s })}</h2>${parts}
  <details class="cov" ${ui.covOpen ? 'open' : ''} id="cov-d"><summary><h2>${T.cov.title}</h2><span class="sumtxt">${covLine}</span><span class="clickhint">${ui.covOpen ? T.cov.hide : T.cov.show}</span></summary>${table}</details>
  <footer>${t(T.footer, { version: esc(D.version) })}</footer>`
}

const factsScore = (path) => `<div><b>${shareOf().get(path) ?? 0}<span class="of"> ${t(T.file.of, { score: liveScore() })}</span></b>${T.file.part}</div>`
const actions = (f, i) => `<button class="primary${isReviewed(f.path) ? ' done' : ''}" data-review="${esc(f.path)}">${isReviewed(f.path) ? T.file.reviewedBtn : T.file.markBtn}</button>${FILES[i + 1] ? `<button class="secondary" data-go="${esc(FILES[i + 1].path)}">${T.file.next}</button>` : ''}${ghFile(f.path) ? `<a class="secondary" href="${esc(ghFile(f.path))}" target="_blank" rel="noopener" title="${esc(T.file.commentTitle)}">${T.file.comment}</a>` : ''}`
const noteBox = (path) => `<h3>${T.file.note}</h3><textarea class="note-in" data-note="${esc(path)}" placeholder="${esc(T.file.notePlaceholder)}">${esc(state.notes[path] ?? '')}</textarea>`

function fileView(path) {
  const f = FILES.find((x) => x.path === path)
  if (!f) return summary()
  if (f.extra === 'dependency') return depView(f)
  const i = FILES.indexOf(f)
  const cf = covOf(path)
  const entries = f.entries ?? []
  const owners = D.reviewers.filter((r) => r.files.includes(path))
  const errors = D.fileErrors[path]
  const covFact = cf ? (cf.missing ? `<div><b class="bad">—</b>${T.file.notInReport}</div>` : cf.total === 0 ? `<div><b>—</b>${T.file.declarations}</div>` : `<div><b class="${cf.covered / cf.total < 0.5 ? 'bad' : ''}">${pct(cf.covered / cf.total)}</b>${t(T.file.linesTested, { covered: cf.covered, total: cf.total })}</div>`) : `<div><b>—</b>${esc(f.coverage ?? T.file.noCoverage)}</div>`
  return `<div class="fhead"><div class="grow"><div class="muted small">${t(T.file.position, { i: i + 1, n: FILES.length, change: esc(f.change ?? '') })}</div><div class="fpath"><span class="d">${esc(dir(path))}</span>${esc(base(path))}</div><div class="muted small">${esc(f.why ?? '')}</div></div>${actions(f, i)}</div>
  ${MUST.filter((g) => g.owner === path).map(findingBox).join('')}
  ${f.extra === 'tests' ? `<div class="mustbox done"><h3>${T.file.testTitle}</h3><p>${t(T.file.testWhy, { why: esc(f.why) })}</p></div>` : ''}
  <div class="facts">${factsScore(path)}${f.extra ? '' : `<div><b>${f.reached}<span class="of"> / ${D.totalEntries}</span></b>${t(T.file.reach, { many: TERM.many })}</div>${covFact}`}${errors ? `<div><b class="bad">${errors.errors}</b>${errors.url ? `<a href="${esc(errors.url)}" target="_blank" rel="noopener">${T.file.errors}</a>` : T.file.errors}</div>` : ''}</div>
  <div class="cols"><div>${renderDiff(path)}</div>
  <div class="aside">${noteBox(path)}<h3>${t(T.file.entries, { Many: TERM.Many })}</h3><ul>${entries.slice(0, 12).map((e) => `<li>${esc(e)}</li>`).join('') || `<li class="pp muted">${T.none}</li>`}${entries.length > 12 ? `<li class="pp muted">${t(T.andMore, { n: entries.length - 12 })}</li>` : ''}</ul>
  <h3>${T.file.knows}</h3><ul>${owners.map((r) => `<li class="pp">${esc(r.name)} <span class="muted">· ${esc(r.note)}</span></li>`).join('') || `<li class="pp muted">${T.file.noHistory}</li>`}</ul></div></div>`
}

function findingBox(g) {
  const it = g.items[0]
  const line = findingLine(g)
  const sec = it.kind === 'security' ? D.security.find((x) => x.path === g.owner && x.line === line) : null
  const lint = D.lint.find((x) => x.path === g.owner && x.line === line)
  const on = !groupActive(g)
  const url = ghLine(g.owner, 'R', line)
  return `<div class="mustbox${on ? ' done' : ''}"><h3>${it.kind === 'security' ? t(T.finding.security, { severity: esc(sec?.severity ?? '') }) : t(T.finding.lint, { rule: esc(lint?.rule ?? '') })} <a href="#" data-jump="${line}">${t(T.finding.atLine, { line })}</a></h3>
    <p>${esc(sec?.message ?? lint?.message ?? it.title)}</p>${sec?.text ? `<code class="snip">${esc(sec.text)}</code>` : ''}
    <label class="ack"><input type="checkbox" data-ack="${esc(g.id)}" ${on ? 'checked' : ''}> ${it.kind === 'security' ? T.finding.ackSecurity : T.finding.ackLint}</label>${url ? ` <a class="small" href="${esc(url)}" target="_blank" rel="noopener">${t(T.finding.comment, { line })}</a>` : ''}</div>`
}

function findingView(id) {
  const g = MUST.find((x) => x.id === id)
  if (!g) return summary()
  if (!g.owner) {
    const on = !groupActive(g)
    const unread = g.items[0].kind === UNREAD
    return `<div class="muted small">${T.nav.must}</div><h1>${unread ? T.must.unknown : T.must.vulnerability}</h1><div class="mustbox${on ? ' done' : ''}"><p>${esc(g.items[0].title)}</p>${unread ? `<p class="small muted">${T.finding.unknownWhy}</p>` : ''}<label class="ack"><input type="checkbox" data-ack="${esc(g.id)}" ${on ? 'checked' : ''}> ${unread ? T.finding.ackUnknown : T.finding.ackVulnerability}</label></div>`
  }
  return `<div class="muted small">${T.nav.must}</div><h1>${esc(groupLabel(g))}</h1><p class="lead">${t(T.finding.lead, { points: POINTS0.get(id) ?? 0 })}</p>
  ${findingBox(g)}<p class="small"><a href="#file:${esc(g.owner)}">${t(T.finding.open, { file: esc(base(g.owner)) })}</a></p>${renderDiff(g.owner)}`
}

function depView(f) {
  const i = FILES.indexOf(f)
  const list = D.dependencies.filter((c) => c.manifest === f.path)
  const card = (c) => {
    const key = c.change === 'removed' ? 'removed' : c.change === 'added' ? 'added' : c.change === 'moved' ? 'moved' : /^(minor bump of a 0\.x|patch bump of a 0\.0)/.test(c.note ?? '') ? 'zeroMinor' : c.bump ?? 'unknown'
    const npm = f.path.endsWith('package.json') ? `https://www.npmjs.com/package/${c.name}?activeTab=versions` : null
    const tag = key === 'zeroMinor' ? T.dep.zeroMinorTag : c.bump ?? c.change
    return `<div class="dep"><span class="nm">${esc(c.name)}</span><span class="sec">${esc(c.section)}</span>
      <div class="ver">${c.from ? esc(c.from) : `<span class="muted">${T.dep.none}</span>`}<span class="arrow">→</span>${c.to ? esc(c.to) : `<span class="muted">${T.dep.removed}</span>`}<span class="bump${c.critical ? ' bad' : ''}">${esc(tag)}</span></div>
      <p class="mean">${T.dep.means[key] ?? T.dep.means.unknown}</p>
      <div class="diff"><table><tr class="d-hunk"><td colspan="2">${esc(t(T.dep.where, { section: c.section, file: base(f.path) }))}</td></tr>${c.from ? `<tr class="d-del"><td class="d-n">−</td><td class="d-c">"${esc(c.name)}": "${esc(c.from)}"</td></tr>` : ''}${c.to ? `<tr class="d-add"><td class="d-n">+</td><td class="d-c">"${esc(c.name)}": "${esc(c.to)}"</td></tr>` : ''}</table></div>
      ${c.critical ? `<h4>${T.dep.howTitle}</h4><ol><li>${t(T.dep.how1, { from: esc(c.from ?? ''), to: esc(c.to ?? '') })}${npm ? ` (<a href="${esc(npm)}" target="_blank" rel="noopener">${T.dep.npm}</a>)` : ''}</li><li>${t(T.dep.how2, { name: `<code>${esc(c.name)}</code>` })}</li><li>${t(T.dep.how3, { one: TERM.one })}</li></ol>` : ''}</div>`
  }
  return `<div class="fhead"><div class="grow"><div class="muted small">${t(T.file.position, { i: i + 1, n: FILES.length, change: T.dep.change })}</div><div class="fpath"><span class="d">${esc(dir(f.path))}</span>${esc(base(f.path))}</div><div class="muted small">${pl(list.length, T.packages)}</div></div>${actions(f, i)}</div>
  <div class="facts">${factsScore(f.path)}</div>
  <div class="cols"><div>${list.map(card).join('') || `<p class="muted">${esc(f.why)}</p>`}</div><div class="aside">${noteBox(f.path)}</div></div>`
}
</script>
<script>
/* farol report, in the browser (3/3): what the change can affect, the API contract, the details of the analysis,
 * the results for the pull request, routing and events. Uses wb-core.js and wb-views.js. */
const compact = (n) => (n < 1000 ? String(n) : n < 1e6 ? `${(n / 1000).toFixed(n < 1e4 ? 1 : 0)}k` : `${(n / 1e6).toFixed(n < 1e7 ? 1 : 0)}M`)

/** Pages/operations the change can affect: try them by hand, or mark the ones that ship behind a feature flag. */
function renderOps(limit) {
  if (!OPS.length) return `<p class="muted">${t(T.plan.none, { many: TERM.many })}</p>`
  const tried = OPS.filter((o) => state.tested.includes(o.key)).length
  const flagged = OPS.filter((o) => isFlagged(o.key)).length
  const out = GROUPS.filter((g) => g.file && flagCovered(g.file) && !isReviewed(g.file))
  const row = (o) => {
    const done = state.tested.includes(o.key)
    const fl = isFlagged(o.key)
    const files = o.files.map((f) => `<span class="${flagCovered(f) ? 'gone' : ''}">${esc(base(f))}</span>`)
    const traffic = o.hits || o.errors ? `<span class="op-traffic">${[o.hits ? t(TERM.one === 'page' ? T.plan.views : T.plan.requests, { n: compact(o.hits) }) : '', o.errors ? (o.errorsUrl ? `<a href="${esc(o.errorsUrl)}" target="_blank" rel="noopener">${pl(o.errors, T.plan.errors)}</a>` : pl(o.errors, T.plan.errors)) : ''].filter(Boolean).join(' · ')}</span>` : ''
    return `<div class="op${done ? ' done' : ''}${fl ? ' flagged' : ''}"><label class="op-main"><input type="checkbox" data-test="${esc(o.key)}" ${done ? 'checked' : ''} aria-label="${esc(T.plan.triedBox)}">
      <span class="op-txt"><span class="op-path">${esc(o.path)}</span>${o.kind === 'new' ? `<span class="op-new">${T.plan.newTag}</span>` : ''}${traffic}
      <span class="op-via">${o.kind === 'new' ? T.plan.servedBy : T.plan.runs} ${files.slice(0, 2).join(', ')}${files.length > 2 ? ' ' + t(T.andMore, { n: files.length - 2 }) : ''}</span></span></label>
      <button type="button" class="op-flag" data-flag="${esc(o.key)}" aria-pressed="${fl}" title="${esc(t(T.plan.flagTitle, { one: TERM.one }))}">${fl ? T.plan.flagOn : T.plan.flagOff}</button></div>`
  }
  const first = OPS.slice(0, limit)
  const rest = OPS.slice(limit)
  return `<div class="ops-status"><span>${t(T.plan.tried, { done: tried, total: OPS.length })}</span><span>${t(T.plan.flagged, { n: flagged })}</span>${out.length ? `<span class="ops-out">${out.map((g) => t(T.plan.left, { file: esc(base(g.file)), points: POINTS0.get(g.id) ?? 0 })).join(' · ')}</span>` : ''}</div>
  <div class="ops-head"><span>${t(T.plan.head, { one: TERM.one })}</span><span>${T.plan.flagHead}</span></div>
  <div class="ops">${first.map(row).join('')}</div>
  ${rest.length ? `<details class="ops-more"><summary>${t(T.plan.more, { what: pl(rest.length, T.entriesPair) })}</summary><div class="ops">${rest.map(row).join('')}</div></details>` : ''}`
}

function planView() {
  const nNew = OPS.filter((o) => o.kind === 'new').length
  return `<h1>${T.plan.title}</h1><p class="lead">${t(T.plan.lead, { n: OPS.length - nNew, many: TERM.many, added: nNew ? t(T.plan.leadNew, { what: pl(nNew, T.newEntries) }) : '', one: TERM.one })}</p>
  <div class="opsbox">${renderOps(10)}</div>`
}

function contractView() {
  const list = D.contracts ?? []
  const ids = contractGroups.map((g) => g.id).join('|')
  const acked = contractGroups.length > 0 && contractGroups.every((g) => isAcked(g.id))
  const callers = (key) => { const c = D.callers[key]; return c?.length ? `<div class="small muted">${t(T.contract.callers, { services: c.map((x) => esc(x.service)).join(', ') })}</div>` : '' }
  const row = (e) => `<div class="contract"><span class="k">${esc(e.key)}</span>${e.level !== 'safe' ? `<span class="pill">${esc(T.contract.levels[e.level])}</span>` : ''}${callers(e.key)}<ul>${e.changes.map((c) => `<li class="${c.level}"><span class="w">${esc(c.where)}</span><span class="d">${esc(c.detail)}</span></li>`).join('')}</ul>${e.omitted ? `<div class="small muted">${t(T.andMore, { n: e.omitted })}</div>` : ''}</div>`
  const bad = list.filter((e) => e.level !== 'safe')
  return `<h1>${T.contract.title}</h1><p class="lead">${T.contract.lead}</p>
  ${contractGroups.length ? `<label class="ack big"><input type="checkbox" data-ack="${esc(ids)}" ${acked ? 'checked' : ''}> ${T.contract.ack}</label>` : ''}
  <h2>${T.contract.breaking}</h2>${bad.map(row).join('') || `<p class="muted">${T.none}</p>`}<h2>${T.contract.safe}</h2>${list.filter((e) => e.level === 'safe').map(row).join('') || `<p class="muted">${T.none}</p>`}`
}

/** The full analysis (routes, reach, signals, dependencies, reasons, diagnostics), in a frame of its own. */
function detailsView() {
  return `<h1>${T.details.title}</h1><p class="lead">${T.details.lead}</p><iframe class="details-frame" id="details-frame" title="${esc(T.details.title)}"></iframe>`
}
function fillDetails() {
  const frame = document.getElementById('details-frame')
  const src = document.getElementById('farol-details')
  if (!frame || !src) return
  const html = JSON.parse(src.textContent)
  const theme = document.documentElement.dataset.theme
  frame.srcdoc = theme ? html.replace('<html ', `<html data-theme="${theme}" `) : html
}
window.addEventListener('farol-theme', () => { if (ui.view === 'details') fillDetails() })

/** Just for curiosity: how much of the pull request needed a careful read, and the time that saves. */
function savedTime() {
  const lines = new Map(D.allFiles.map((f) => [f.path, f.added + f.removed]))
  const total = [...lines.values()].reduce((a, b) => a + b, 0)
  if (!total) return ''
  const needed = new Set([...FILES.filter((f) => tierOf(f) === 'high' || tierOf(f) === 'medium').map((f) => f.path), ...MUST.filter((g) => g.owner).map((g) => g.owner)])
  const read = [...needed].reduce((a, p) => a + (lines.get(p) ?? 0), 0)
  const PACE = 400 // lines an hour: the usual upper bound of a careful code review
  const time = (n) => { const m = Math.max(1, Math.round((n / PACE) * 60)); return m < 60 ? t(T.results.minutes, { m }) : t(T.results.hours, { h: Math.floor(m / 60), m: String(m % 60).padStart(2, '0') }) }
  return `<div class="saved"><div class="big">${pct(read / total)}</div><p>${t(T.results.saved, { read, total, files: needed.size, all: D.allFiles.length, pace: PACE, time: time(read), full: time(total) })}</p>
    <div class="bar track"><span style="width:${(read / total) * 100}%"></span></div><small>${T.results.curiosity}</small></div>`
}

/** Everything the reviewer did, as GitHub Markdown for a pull request comment. */
function resultsMd() {
  const s = liveScore()
  const code = (x) => '`' + x + '`'
  const L = [T.md.title, '', t(T.md.score, { from: SCORE0, to: s, level: T.levels[levelOf(s)].toLowerCase() }), '']
  const must = mustList()
  if (must.length) {
    L.push(T.md.must)
    for (const m of must) {
      const g = m.groups[0]
      const what = m.contract ? t(T.md.contract, { keys: breakingKeys().map(code).join(', ') }) : g.owner ? t(g.items[0].kind === 'security' ? T.md.security : T.md.lint, { where: code(`${short(g.owner)}:${findingLine(g)}`) }) : g.items[0].title
      L.push(`- [${mustDone(m) ? 'x' : ' '}] ${what}`)
    }
    L.push('')
  }
  L.push(t(T.md.files, { done: FILES.filter(fileDone).length, total: FILES.length }))
  for (const x of filesByTier()) L.push(`- ${x.label}: ${x.files.filter(fileDone).length}/${x.files.length}`)
  const left = FILES.filter((f) => !fileDone(f) && (tierOf(f) === 'high' || tierOf(f) === 'medium'))
  if (left.length) L.push('', t(T.md.left, { files: left.slice(0, 10).map((f) => code(base(f.path))).join(', ') + (left.length > 10 ? ' ' + t(T.andMore, { n: left.length - 10 }) : '') }))
  const flaggedFiles = FILES.filter((f) => flagCovered(f.path) && !isReviewed(f.path))
  if (flaggedFiles.length) L.push(t(T.md.flaggedFiles, { files: flaggedFiles.map((f) => code(base(f.path))).join(', ') }))
  if (OPS.length) {
    const tried = OPS.filter((o) => state.tested.includes(o.key))
    L.push('', t(T.md.tried, { done: tried.length, total: OPS.length, many: TERM.many }))
    for (const o of tried.slice(0, 15)) L.push(`- [x] ${code(o.path)}${isFlagged(o.key) ? ' ' + T.md.behindFlag : ''}`)
    for (const o of OPS.filter((x) => isFlagged(x.key) && !state.tested.includes(x.key)).slice(0, 15)) L.push(`- ${T.md.flagged} ${code(o.path)}`)
  }
  if (S) L.push('', t(T.md.coverage, { ratio: pct(S.ratio), covered: S.covered, total: S.total }) + (S.missing.length ? t(T.md.coverageWithout, { ratio: pct(S.reportedRatio), files: pl(S.missing.length, T.files) }) : '') + '.')
  const notes = Object.entries(state.notes).filter(([, v]) => v.trim())
  if (notes.length) { L.push('', T.md.notes); for (const [p, v] of notes) L.push(`- ${code(short(p))}: ${v.trim().replace(/\s*\n\s*/g, ' ')}`) }
  L.push('', `<sub>${t(T.md.footer, { version: D.version, base: D.base, head: D.head })}</sub>`)
  return L.join('\n')
}
function resultsView() {
  return `<div class="results"><h1>${T.results.title}</h1><p class="lead">${T.results.lead}</p>${savedTime()}
  <div class="btns"><button class="primary" data-copyresults>${T.results.copy}</button>${D.links.pr ? `<a class="secondary" href="${esc(D.links.pr)}" target="_blank" rel="noopener">${T.results.openPr}</a>` : ''}</div>
  <pre>${esc(resultsMd())}</pre></div>`
}
async function copyResults() {
  const text = resultsMd()
  try { await navigator.clipboard.writeText(text) } catch {
    const area = document.createElement('textarea'); area.value = text; document.body.append(area); area.select(); document.execCommand('copy'); area.remove()
  }
  document.querySelectorAll('[data-copyresults]').forEach((b) => { const was = b.textContent; b.textContent = T.results.copied; setTimeout(() => { b.textContent = was }, 1600) })
}

function render() {
  ui.view = decodeURIComponent(location.hash.slice(1)) || 'summary'
  const railEl = document.getElementById('rail')
  const y = railEl.scrollTop
  rail()
  railEl.scrollTop = y
  const v = ui.view
  document.getElementById('main').innerHTML = v.startsWith('file:') ? fileView(v.slice(5)) : v.startsWith('finding:') ? findingView(v.slice(8)) : v === 'contract' ? contractView() : v === 'plan' ? planView() : v === 'details' ? detailsView() : v === 'results' ? resultsView() : summary()
  if (v === 'details') fillDetails()
}
addEventListener('hashchange', () => { render(); scrollTo(0, 0) })
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-copyresults]')) { copyResults(); return }
  const flag = e.target.closest('[data-flag]'); if (flag) { toggle('flagged', flag.dataset.flag); return }
  const r = e.target.closest('[data-review]'); if (r) { toggle('reviewed', r.dataset.review); return }
  const g = e.target.closest('[data-go]'); if (g) location.hash = 'file:' + g.dataset.go
})
document.addEventListener('toggle', (e) => {
  if (e.target.id === 'cov-d') { ui.covOpen = e.target.open; const h = e.target.querySelector('.clickhint'); if (h) h.textContent = ui.covOpen ? T.cov.hide : T.cov.show }
  const id = e.target.dataset?.tier; if (id) { if (e.target.open) ui.tierOpen.add(id); else ui.tierOpen.delete(id) }
}, true)
document.addEventListener('change', (e) => {
  const el = e.target
  if (el.dataset.reviewCb) { toggle('reviewed', el.dataset.reviewCb, el.checked); return }
  if (el.dataset.ack) { el.dataset.ack.split('|').forEach((id) => setIn('acked', id, el.checked)); emit(); return }
  if (el.dataset.test) toggle('tested', el.dataset.test, el.checked)
})
document.addEventListener('input', (e) => {
  const p = e.target.dataset?.note
  if (p === undefined) return
  state.notes = Object.fromEntries(Object.entries({ ...state.notes, [p]: e.target.value }).filter(([, v]) => v.trim()))
  save()
})
document.addEventListener('keydown', (e) => {
  if (e.target.closest?.('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return
  const order = ['summary', ...mustList().map((m) => (m.contract ? 'contract' : 'finding:' + m.groups[0].id)), ...FILES.map((f) => 'file:' + f.path)]
  const i = order.indexOf(ui.view)
  if (e.key === 'j' && i < order.length - 1) location.hash = order[i + 1]
  if (e.key === 'k' && i > 0) location.hash = order[i - 1]
  if (e.key === 'r' && ui.view.startsWith('file:')) toggle('reviewed', ui.view.slice(5))
})
initTheme(document.getElementById('theme'))
onChange(render)
render()
</script>
</body>
</html>
