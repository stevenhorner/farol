# farol for a C#/.NET solution (ASP.NET Core MVC, Web API, minimal APIs, worker services). Shadow mode: it comments, it
# never blocks.
#
#   farol        reads git, writes the HTML report and comments on the PR. Never runs the PR's code: the .NET SDK only
#                reads it (Roslyn), and MSBuild never evaluates your projects.
#
# Diff coverage, lint (SARIF) and `dotnet list package --vulnerable` reports are not read for C# yet: the report shows
# them as not verified. Packages are not restored here: `dotnet restore` evaluates the PR's MSBuild files, and this job
# can write to the pull request. Without packages, calls on package types fall back to project members of the same name
# and shape (conservative: more reach, never less).
#
# Every push to a pull request that is ready for review posts a new comment: a link that opens the HTML report in the
# browser, and after a push a second report with only the commits since the previous push.
# Pin winnin/farol/action to a commit (`@<sha> # main as of <date>`) once it works for you.
name: farol

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: farol-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  farol:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Shadow mode: nothing here can fail CI or block the pull request.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The base, the merge-base and the history (suggested reviewers) must be available.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # farol builds its C# helper with this SDK (no NuGet download) and reads your projects with its compiler.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ hashFiles('global.json') != '' && 'global.json' || '' }}
          dotnet-version: ${{ hashFiles('global.json') == '' && '10.0.x' || '' }}

      # Helper outputs are cached by git tree: the base of every pull request is read once.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/farol
          key: farol-helper-${{ runner.os }}-${{ github.event.pull_request.base.sha }}
          restore-keys: farol-helper-${{ runner.os }}-

      # After a push, also the commits since the previous head of the pull request.
      - name: Previous push
        id: since
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
        run: |
          since=""
          if [ "$ACTION" = "synchronize" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then since="$BEFORE"; fi
          echo "sha=$since" >> "$GITHUB_OUTPUT"

      - name: farol analyze
        uses: winnin/farol/action@main
        with:
          command: analyze
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          out: farol.json

      - name: farol analyze (since the last push)
        if: steps.since.outputs.sha != ''
        uses: winnin/farol/action@main
        with:
          command: analyze
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          since: ${{ steps.since.outputs.sha }}
          out: farol-since.json

      - name: farol reviewers
        uses: winnin/farol/action@main
        continue-on-error: true
        with:
          command: reviewers
          in: farol.json
          reviewers-file: reviewers.json

      - name: farol html
        uses: winnin/farol/action@main
        with:
          command: html
          in: farol.json
          html-out: farol.html
          reviewers-file: ${{ hashFiles('reviewers.json') != '' && 'reviewers.json' || '' }}

      - name: farol html (since the last push)
        if: steps.since.outputs.sha != ''
        uses: winnin/farol/action@main
        with:
          command: html
          in: farol-since.json
          html-out: farol-since.html

      # Single, non-zipped files: the link in the comment opens the report in the browser.
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          path: farol.html
          archive: false

      - uses: actions/upload-artifact@v7
        id: upload-since
        if: steps.since.outputs.sha != ''
        with:
          path: farol-since.html
          archive: false

      # Pull requests from forks get a read-only token: no comment there (the reports stay in the run's artifacts).
      - name: farol comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: winnin/farol/action@main
        with:
          command: comment
          in: farol.json
          pr: ${{ github.event.pull_request.number }}
          new-comment: 'true'
          report-url: ${{ steps.upload.outputs.artifact-url }}
          since-in: ${{ steps.since.outputs.sha != '' && 'farol-since.json' || '' }}
          since-report-url: ${{ steps.upload-since.outputs.artifact-url }}
          reviewers-file: ${{ hashFiles('reviewers.json') != '' && 'reviewers.json' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
